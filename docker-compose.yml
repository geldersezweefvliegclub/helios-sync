services:
  helios-sync:
    build: .
    image: helios-sync:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Runtime secrets: Google service account
      - ./data/google-sa.json:/data/google-sa.json:ro
    environment:
      GOOGLE_CREDENTIALS_PATH: /data/google-sa.json
